version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: backend/.env
    volumes:
      - uploads_data:/app/uploads
      - songs_data:/app/Songs
      - mp_cache:/app/.mp
      - ./backend/config.json:/app/config.json
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
  songs_data:
  mp_cache:
