version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: backend/.env
    volumes:
      - uploads_data:/app/uploads
      - songs_data:/app/Songs
      - mp_cache:/app/.mp
    ports:
      - "8000:8000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.videomachine.rule=Host(`videomachine-api.finablasolution.cloud`)"
      - "traefik.http.routers.videomachine.entrypoints=websecure"
      - "traefik.http.routers.videomachine.tls=true"
      - "traefik.http.routers.videomachine.tls.certresolver=letsencrypt"
      - "traefik.http.services.videomachine.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.videomachine-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.videomachine-cors.headers.accesscontrolallowmethods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.videomachine-cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.routers.videomachine.middlewares=videomachine-cors"

volumes:
  uploads_data:
  songs_data:
  mp_cache:
